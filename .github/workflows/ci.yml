name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cover.outputs.percent }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The package imports the Wails runtime, which needs the GTK and WebKit
      # headers even for a plain `go test`.
      - name: Install GUI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test
        run: go test -tags webkit2_41 -coverprofile=coverage.out ./...

      - name: Read coverage
        id: cover
        run: |
          percent=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $percent%"

      # A badge is only worth something if it cannot quietly rot.
      - name: Enforce minimum coverage
        env:
          MINIMUM: "70"
        run: |
          percent="${{ steps.cover.outputs.percent }}"
          if awk "BEGIN {exit !($percent < $MINIMUM)}"; then
            echo "::error::coverage $percent% is below the required $MINIMUM%"
            exit 1
          fi

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test
        working-directory: frontend
        run: npm test

  badge:
    name: Update coverage badge
    needs: [go, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the badge in the README
        env:
          PERCENT: ${{ needs.go.outputs.coverage }}
        run: |
          colour=red
          awk "BEGIN {exit !($PERCENT >= 60)}" && colour=orange
          awk "BEGIN {exit !($PERCENT >= 75)}" && colour=yellowgreen
          awk "BEGIN {exit !($PERCENT >= 85)}" && colour=brightgreen
          sed -i -E "s|coverage-[0-9.]+%25-[a-z]+|coverage-${PERCENT}%25-${colour}|" README.md

      - name: Commit when the number moved
        run: |
          if git diff --quiet README.md; then
            echo "Badge already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update coverage badge to ${{ needs.go.outputs.coverage }}% [skip ci]" README.md
          git push
