version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Fehler beim Aufräumen und beim Schreiben in Testhilfen sind
      # aussagelos, wenn der Test danach ohnehin fehlschlägt.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
